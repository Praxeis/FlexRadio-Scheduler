{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card">
            <div class="card-header"><h4>Forgot Password</h4></div>
            <div class="card-body">
                <p class="text-muted">Enter your callsign or email address and we'll send you a password reset link.</p>
                <form method="POST">
                    <div class="mb-3">
                        <label for="identifier" class="form-label">Callsign or Email</label>
                        <input type="text" class="form-control" id="identifier" name="identifier" required autofocus>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Send Reset Link</button>
                </form>
                <p class="mt-3 text-center">
                    <a href="{{ url_for('login') }}">Back to Login</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
