<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"></head>
<body style="font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px;">
    <h2 style="color: #333;">Upcoming Booking Reminder</h2>
    <p>Hi {{ user.name }} ({{ user.callsign }}),</p>
    <p>This is a reminder that you have an upcoming booking on the FlexRadio Scheduler:</p>
    <div style="background-color: #f8f9fa; border-left: 4px solid #0d6efd; padding: 15px; margin: 20px 0;">
        <p style="margin: 0; font-size: 18px; font-weight: bold;">{{ date_str }}</p>
        <p style="margin: 5px 0 0 0; font-size: 16px;">{{ time_str }}</p>
    </div>
    <p>Make sure your SmartSDR client is ready to connect when your slot begins.</p>
    <hr style="border: none; border-top: 1px solid #eee;">
    <p style="color: #999; font-size: 12px;">FlexRadio Scheduler</p>
</body>
</html>
