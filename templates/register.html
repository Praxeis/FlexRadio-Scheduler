{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card">
            <div class="card-header"><h4>Register</h4></div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label for="callsign" class="form-label">Callsign</label>
                        <input type="text" class="form-control" id="callsign" name="callsign" required autofocus
                               placeholder="e.g. W5ABC">
                    </div>
                    <div class="mb-3">
                        <label for="name" class="form-label">Name</label>
                        <input type="text" class="form-control" id="name" name="name" required
                               placeholder="Your name">
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" name="email" required
                               placeholder="your@email.com">
                    </div>
                    <div class="mb-3">
                        <label for="zerotier_node_id" class="form-label">ZeroTier Node ID</label>
                        <input type="text" class="form-control font-monospace" id="zerotier_node_id"
                               name="zerotier_node_id" maxlength="10"
                               placeholder="e.g. a1b2c3d4e5" pattern="[0-9a-fA-F]{10}">
                        <div class="form-text">
                            Your 10-character ZeroTier node ID. Find it in the ZeroTier app under "My Address".
                            Required for remote radio access.
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password" required
                               minlength="4">
                    </div>
                    <button type="submit" class="btn btn-success w-100">Register</button>
                </form>
                <p class="mt-3 text-center">
                    Already have an account? <a href="{{ url_for('login') }}">Login</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
